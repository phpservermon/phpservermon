<div class="row">
        <noscript><div hidden></noscript>
        <div class="ms-auto btn-group btn-group-sm mb-3" role="group" aria-label="Layout selection">
                <button type="button" class="btn btn-outline-secondary {% if block_layout_active %} active {% endif %}"
                        id="block-layout" aria-label="Block layout"
                        onclick="psm_saveLayout(0)">
                        <i class="fas fa-th"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary {% if list_layout_active %} active {% endif %}"
                        id="table-layout" aria-label="List layout"
                        onclick="psm_saveLayout(1)">
                        <i class="fas fa-bars"></i>
                </button>
        </div>
        <noscript></div></noscript>
</div>
